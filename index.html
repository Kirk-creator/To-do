<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a3a2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Checklist" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Daily Checklist</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0c1612;
        color: #a8b5a0;
        font-family: 'DM Sans', system-ui, sans-serif;
      }
      #boot-fallback {
        padding: 2.5rem 1.25rem;
        text-align: center;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <p id="boot-fallback">Loading checklist…</p>
    </div>
    <!-- Vite dev entry (transformed away on `vite build`) -->
    <script type="module" src="/src/main.tsx"></script>
    <!--
      GitHub Pages currently serves source from `main`, so /src/main.tsx never
      runs. This classic script boots the committed production bundle instead.
      Kept as a non-module script so Vite does not try to bundle it.
    -->
    <script>
      (function () {
        if (!location.hostname.endsWith('github.io')) return
        if (!document.getElementById('boot-fallback')) return
        if (window.__DAILY_CHECKLIST_BOOTED__) return

        var css = document.createElement('link')
        css.rel = 'stylesheet'
        css.href = './assets/app.css'
        document.head.appendChild(css)

        var script = document.createElement('script')
        script.type = 'module'
        script.src = './assets/app.js'
        script.onerror = function () {
          var el = document.getElementById('boot-fallback')
          if (el) {
            el.textContent =
              'Could not load the app bundle. Try a hard refresh, or open the site again in a minute.'
          }
        }
        document.body.appendChild(script)
      })()
    </script>
  </body>
</html>
